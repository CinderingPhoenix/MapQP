
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@latest/dist/leaflet-rotate.min.js"></script>
  <style>
    html, body, #map {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #e0e0e0;
    }

    .leaflet-control-rotate,
    .leaflet-control-compass,
    .leaflet-bar.compass {
      display: none !important;
    }

    .leaflet-top.leaflet-right {
      top: 60px;
      right: 16px;
    }

    .settings-control {
      background: white;
      border-radius: 50% !important;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      width: 54px !important;
      height: 54px !important;
      line-height: 54px !important;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .compass-control {
      background: white;
      border-radius: 50% !important;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      width: 54px !important;
      height: 54px !important;
      line-height: 54px !important;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .compass-icon {
      display: inline-block;
      width: 32px;
      height: 32px;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    /* Applies to both our compass and Leaflet's CSS transitions. */
    .reduce-motion #map,
    .reduce-motion #map * {
      transition: none !important;
      animation: none !important;
    }

    .compass-control.accessibility-compass-control {
      width: 72px !important;
      height: 72px !important;
      line-height: 72px !important;
    }

    .accessibility-compass-control .compass-icon {
      width: 48px;
      height: 48px;
    }

    .mute-control {
      background: white;
      border-radius: 50% !important;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
      width: 54px !important;
      height: 54px !important;
      line-height: 54px !important;
      text-align: center;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px !important;
    }

    /* Destination uses a square shape, not color alone. */
    .destination-marker-shape {
      width: 20px;
      height: 20px;
      background: #1d5962;
      border: 3px solid #fffdf8;
      border-radius: 2px;
      box-sizing: border-box;
    }

    /* Only style application-owned controls/overlays, never the tile imagery. */
    .bold-text .leaflet-control-attribution { font-weight: 700; }
    .increase-contrast .settings-control,
    .increase-contrast .compass-control,
    .increase-contrast .mute-control { border: 2px solid #111; }
    .increase-contrast .leaflet-control-attribution,
    .increase-contrast .leaflet-control-attribution a { color: #111; background: #fff; }
    .reduce-transparency .leaflet-control-attribution { background: #fff; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = null;
    var marker = null;
    var circle = null;
    var remainingPolyline = null;
    var traversedPolyline = null;
    var destMarker = null;
    var isHeadingFocused = false;
    var routeData = null;
    var currentCompassAngle = null;
    // Remain still until React Native supplies the device preference.
    window.reduceMotionEnabled = true;

    window.setVisualAccessibility = function(bold, contrast, opaque) {
      document.documentElement.classList.toggle('bold-text', !!bold);
      document.documentElement.classList.toggle('increase-contrast', !!contrast);
      document.documentElement.classList.toggle('reduce-transparency', !!opaque);
    };

    window.setReduceMotion = function(enabled) {
      window.reduceMotionEnabled = !!enabled;
      document.documentElement.classList.toggle('reduce-motion', !!enabled);
      if (!enabled) return;

      var wasResetting = resetFrameId !== null;
      cancelBearingAnimations();
      if (map) {
        map.stop();
        if (isHeadingFocused && currentAnimatedBearing !== null) {
          currentAnimatedBearing = currentTargetBearing;
          map.setBearing(currentTargetBearing);
        } else if (wasResetting) {
          currentAnimatedBearing = 0;
          map.setBearing(0);
        }
      }
    };

    /**
     * Calculates the closest projected point on a line segment
     * to an external coordinate point.
     */
    function getClosestPointOnSegment(p, a, b) {
      var cosLat = Math.cos(a[0] * Math.PI / 180);
      var px = (p[1] - a[1]) * cosLat;
      var py = p[0] - a[0];
      var bx = (b[1] - a[1]) * cosLat;
      var by = b[0] - a[0];
      var lenSq = bx * bx + by * by;

      if (lenSq === 0) {
        return {
          point: a,
          distanceSq: py * py + px * px,
          t: 0
        };
      }

      var t = Math.max(
        0,
        Math.min(1, (px * bx + py * by) / lenSq)
      );

      var closestLat = a[0] + t * by;
      var closestLng = a[1] + t * (b[1] - a[1]);
      var dx = (p[1] - closestLng) * cosLat;
      var dy = p[0] - closestLat;

      return {
        point: [closestLat, closestLng],
        distanceSq: dx * dx + dy * dy,
        t: t
      };
    }

    /**
     * Splits route geometry into completed and remaining sections.
     */
    function splitRouteAtUser(userLat, userLng, geometry) {
      if (!geometry || geometry.length < 2) {
        return {
          traversed: [],
          remaining: geometry || []
        };
      }

      var bestSegmentIndex = 0;
      var minDistanceSq = Infinity;
      var snappedPoint = [userLat, userLng];

      for (var i = 0; i < geometry.length - 1; i++) {
        var closest = getClosestPointOnSegment(
          [userLat, userLng],
          geometry[i],
          geometry[i + 1]
        );

        if (closest.distanceSq < minDistanceSq) {
          minDistanceSq = closest.distanceSq;
          bestSegmentIndex = i;
          snappedPoint = closest.point;
        }
      }

      var traversed = geometry.slice(0, bestSegmentIndex + 1);
      traversed.push(snappedPoint);

      var remaining = [snappedPoint].concat(
        geometry.slice(bestSegmentIndex + 1)
      );

      return {
        traversed: traversed,
        remaining: remaining
      };
    }

    /**
     * Creates a dashed line for the completed route.
     */
    function createTraversedPolyline(geometry) {
      return L.polyline(geometry, {
        smoothFactor: 0,
        color: '#888888',
        weight: 6,
        opacity: 0.8,
        dashArray: '6, 10',
        lineCap: 'butt'
      }).addTo(map);
    }

    /**
     * Creates a solid line for the remaining route.
     */
    function createRemainingPolyline(geometry) {
      return L.polyline(geometry, {
        smoothFactor: 0,
        color: '#1d5962',
        weight: 6,
        opacity: 0.9
      }).addTo(map);
    }

    /**
     * Creates a visual destination indicator, not an actionable map control.
     */
    function createDestinationMarker(latitude, longitude) {
      var destinationMarker = L.marker([latitude, longitude], {
        keyboard: false,
        interactive: false,
        autoPanOnFocus: false,
        icon: L.divIcon({
          className: 'destination-marker',
          html: '<div class="destination-marker-shape"></div>',
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        })
      }).addTo(map);
      // keyboard:false prevents Leaflet's button role/tabindex. aria-hidden also
      // excludes the decorative div from VoiceOver's touch/virtual navigation.
      destinationMarker.getElement().setAttribute('aria-hidden', 'true');
      return destinationMarker;
    }

    /**
     * Initializes route lines and destination marker.
     */
    function initRoute(rData, uLat, uLng) {
      if (!rData) return;

      var split = splitRouteAtUser(
        uLat,
        uLng,
        rData.geometry
      );

      traversedPolyline = createTraversedPolyline(
        split.traversed
      );

      remainingPolyline = createRemainingPolyline(
        split.remaining
      );

      destMarker = createDestinationMarker(
        rData.destination.latitude,
        rData.destination.longitude
      );

      map.fitBounds(remainingPolyline.getBounds(), {
        padding: [36, 36],
        animate: !window.reduceMotionEnabled
      });
    }

    // Camera-only commands never change routeData, markers, or GPS subscriptions.
    function reportCamera(type, command) {
      if (!map || !window.ReactNativeWebView) return;
      window.ReactNativeWebView.postMessage(JSON.stringify({
        type: type, command: command,
        zoom: map.getZoom(), minZoom: map.getMinZoom(), maxZoom: map.getMaxZoom()
      }));
    }

    function beginManualExploration() {
      window.manualCameraExploration = true;
      cancelBearingAnimations();
      map.stop();
      isHeadingFocused = false;
      var compass = document.querySelector('.compass-control');
      if (compass) {
        compass.style.backgroundColor = 'white';
        compass.setAttribute('aria-pressed', 'false');
      }
      window.ReactNativeWebView.postMessage('USER_DRAGGED');
    }

    window.cameraCommand = function(command) {
      if (!map || ['zoom-in', 'zoom-out', 'pan-up', 'pan-down', 'pan-left', 'pan-right'].indexOf(command) < 0) return;
      beginManualExploration();
      if (command === 'zoom-in' || command === 'zoom-out') {
        var delta = command === 'zoom-in' ? 1 : -1;
        map.setZoom(Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), map.getZoom() + delta)), { animate: !window.reduceMotionEnabled });
      } else {
        var size = map.getSize();
        var target = L.point(size.x / 2, size.y / 2);
        if (command === 'pan-up') target.y -= size.y / 4;
        if (command === 'pan-down') target.y += size.y / 4;
        if (command === 'pan-left') target.x -= size.x / 4;
        if (command === 'pan-right') target.x += size.x / 4;
        // The rotation plugin converts screen coordinates to geographic coordinates.
        map.panTo(map.containerPointToLatLng(target), {
          animate: !window.reduceMotionEnabled,
          duration: 0.35,
          easeLinearity: 0.25
        });
      }
      reportCamera('CAMERA_COMMAND_COMPLETE', command);
    };

    // Voice requests use the same operations, but acknowledge only the target
    // camera position. Existing touch commands retain their original protocol.
    var cancelVoiceCamera = null;
    window.voiceCameraCommand = function(command, id) {
      function reply(message) {
        window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'VOICE_CAMERA_RESULT', id: id, message: message }));
      }
      if (!map) { reply('Map is still loading.'); return; }
      if (cancelVoiceCamera) cancelVoiceCamera();
      var timer = null;
      var done = false;
      function finish(message) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        map.off('moveend zoomend', check);
        map.off('dragstart zoomstart', interrupted);
        cancelVoiceCamera = null;
        reply(message);
      }
      function interrupted() { if (armed) finish('Map movement interrupted. Try again.'); }
      var armed = false;
      var targetCenter, targetZoom;
      function check() {
        if (!armed) return;
        if (Math.abs(map.getZoom() - targetZoom) < 0.001 && map.getCenter().distanceTo(targetCenter) < 1) {
          var messages = { 'zoom-in': 'Map zoomed in.', 'zoom-out': 'Map zoomed out.',
            'pan-left': 'Map moved left.', 'pan-right': 'Map moved right.',
            'pan-up': 'Map moved up.', 'pan-down': 'Map moved down.', 'recenter': 'Map recentered.' };
          finish(messages[command]);
        }
      }
      try {
        if (['zoom-in', 'zoom-out', 'pan-left', 'pan-right', 'pan-up', 'pan-down', 'recenter'].indexOf(command) < 0) {
          reply('That map command is not supported.'); return;
        }
        map.stop();
        targetZoom = map.getZoom();
        targetCenter = map.getCenter();
        if (command === 'zoom-in' || command === 'zoom-out') {
          targetZoom += command === 'zoom-in' ? 1 : -1;
          if (targetZoom > map.getMaxZoom() || targetZoom < map.getMinZoom()) {
            reply(command === 'zoom-in' ? 'Maximum zoom reached.' : 'Minimum zoom reached.'); return;
          }
        } else if (command === 'recenter') {
          if (!marker) { reply('Current location is unavailable.'); return; }
          targetCenter = marker.getLatLng();
        } else {
          var size = map.getSize();
          var point = L.point(size.x / 2, size.y / 2);
          if (command === 'pan-left') point.x -= size.x / 4;
          if (command === 'pan-right') point.x += size.x / 4;
          if (command === 'pan-up') point.y -= size.y / 4;
          if (command === 'pan-down') point.y += size.y / 4;
          targetCenter = map.containerPointToLatLng(point);
        }
        cancelVoiceCamera = function() { finish('Map movement interrupted. Try again.'); };
        map.on('moveend zoomend', check);
        timer = setTimeout(function() { finish('Map command timed out. Try again.'); }, 3500);
        // Register before moving; reduced-motion operations can finish synchronously.
        armed = true;
        if (command === 'recenter') window.resetView();
        else window.cameraCommand(command);
        check();
        if (!done) map.on('dragstart zoomstart', interrupted);
      } catch (error) { finish('Could not move the map. Try again.'); }
    };

    /**
     * Initializes Leaflet and its map controls.
     */
    window.initMap = function(
      centerLat,
      centerLng,
      userLat,
      userLng,
      accuracy,
      route,
      accessibilityMode
    ) {
      if (map) return;

      map = L.map('map', {
        zoomControl: false,
        rotate: true,
        touchRotate: true,
        shiftKeyRotate: true
      }).setView([centerLat, centerLng], 16);

      L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
          maxZoom: 19,
          keepBuffer: 4,
          attribution: '&copy; OpenStreetMap contributors'
        }
      ).addTo(map);

      setTimeout(function() {
        if (map) {
          map.invalidateSize();
        }
      }, 250);

      marker = L.circleMarker([userLat, userLng], {
        radius: 8,
        color: '#fffdf8',
        fillColor: '#e06b3c',
        fillOpacity: 1,
        weight: 3
      }).addTo(map);

      circle = L.circle([userLat, userLng], {
        radius: accuracy,
        color: '#e06b3c',
        fillColor: '#e06b3c',
        fillOpacity: 0.3
      }).addTo(map);

      routeData = route;

      if (routeData) {
        initRoute(routeData, userLat, userLng);
      }

      // Settings control
      var SettingsControl = L.Control.extend({
        options: {
          position: 'topleft'
        },

        onAdd: function(map) {
          var container = L.DomUtil.create(
            'button',
            'leaflet-bar leaflet-control settings-control'
          );

          container.type = 'button';
          container.setAttribute('aria-label', 'Settings');

          container.innerHTML =
            '<svg viewBox="0 0 24 24" width="28" height="28" fill="#333">' +
              '<path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.31-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.02-.24-.22-.41-.47-.41h-3.84c-.24 0-.44.17-.47.41L9.26 5.35c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.31-.09.65-.09.94s.03.63.08.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.31.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.03.24.23.41.47.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/>' +
            '</svg>';

          L.DomEvent.on(container, 'click', function(e) {
            L.DomEvent.stopPropagation(e);
            L.DomEvent.preventDefault(e);

            window.ReactNativeWebView.postMessage(
              'OPEN_SETTINGS'
            );
          });

          return container;
        }
      });

      if (!accessibilityMode) {
        map.addControl(new SettingsControl());
      }

      // Compass control
      var CompassControl = L.Control.extend({
        options: {
          position: 'topright'
        },

        onAdd: function(map) {
          var compassClass = accessibilityMode
            ? 'leaflet-bar leaflet-control compass-control accessibility-compass-control'
            : 'leaflet-bar leaflet-control compass-control';

          var container = L.DomUtil.create(
            'button',
            compassClass
          );

          container.type = 'button';
          container.setAttribute('aria-label', 'Compass');
          container.setAttribute('aria-pressed', 'false');

          var compassSize = accessibilityMode ? 48 : 32;

          container.innerHTML =
            '<div id="compass-icon" class="compass-icon">' +
              '<svg viewBox="0 0 24 24" width="' + compassSize + '" height="' + compassSize + '">' +
                '<polygon points="12,2 15,12 12,10" fill="#e06b3c" />' +
                '<polygon points="12,2 9,12 12,10" fill="#f09068" />' +
                '<polygon points="12,22 15,12 12,14" fill="#1d5962" />' +
                '<polygon points="12,22 9,12 12,14" fill="#2d7982" />' +
              '</svg>' +
            '</div>';

          L.DomEvent.on(container, 'click', function(e) {
            L.DomEvent.stopPropagation(e);
            L.DomEvent.preventDefault(e);

            cancelBearingAnimations();
            isHeadingFocused = !isHeadingFocused;

            container.setAttribute(
              'aria-pressed',
              isHeadingFocused ? 'true' : 'false'
            );

            if (isHeadingFocused) {
              container.style.backgroundColor = '#d3e3fd';

              window.ReactNativeWebView.postMessage(
                'HEADING_LOCKED'
              );

              map.setView(marker.getLatLng(), 32, {
                animate: !window.reduceMotionEnabled
              });
            } else {
              container.style.backgroundColor = 'white';

              window.ReactNativeWebView.postMessage(
                'HEADING_UNLOCKED'
              );

              smoothRotateToZero();
            }
          });

          function updateCompassRotation() {
            var rawBearing = map.getBearing
              ? map.getBearing()
              : 0;

            var icon = document.getElementById(
              'compass-icon'
            );

            if (!icon) return;

            if (currentCompassAngle === null) {
              currentCompassAngle = rawBearing;
            } else {
              var diff = (
                (rawBearing - currentCompassAngle) % 360 + 540
              ) % 360 - 180;

              currentCompassAngle += diff;
            }

            icon.style.transform =
              'rotate(' + currentCompassAngle + 'deg)';
          }

          updateCompassRotation();

          map.on('rotate', updateCompassRotation);

          return container;
        }
      });

      map.addControl(new CompassControl());

      // Mute control
      var MuteControl = L.Control.extend({
        options: {
          position: 'topright'
        },

        onAdd: function(map) {
          var container = L.DomUtil.create(
            'button',
            'leaflet-bar leaflet-control mute-control'
          );

          container.type = 'button';
          container.setAttribute(
            'aria-label',
            'Mute navigation'
          );
          container.setAttribute('aria-pressed', 'false');

          var isMuted = false;

          var volHigh =
            '<svg viewBox="0 0 24 24" width="24" height="24" fill="#333"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';

          var volMute =
            '<svg viewBox="0 0 24 24" width="24" height="24" fill="#d9534f"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.11-.31 2.16-.8 3.1-1.42l2.63 2.63 1.27-1.27L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';

          container.innerHTML = volHigh;

          L.DomEvent.on(container, 'click', function(e) {
            L.DomEvent.stopPropagation(e);
            L.DomEvent.preventDefault(e);

            isMuted = !isMuted;

            container.innerHTML = isMuted
              ? volMute
              : volHigh;

            container.setAttribute(
              'aria-pressed',
              isMuted ? 'true' : 'false'
            );

            container.setAttribute(
              'aria-label',
              isMuted ? 'Unmute navigation' : 'Mute navigation'
            );

            window.ReactNativeWebView.postMessage(
              'TOGGLE_MUTE'
            );
          });

          return container;
        }
      });

      map.addControl(new MuteControl());

      // Gestures and native buttons share the same exploration state.
      map.on('dragstart rotatestart', beginManualExploration);
      map.on('zoomstart', function(e) {
        // Programmatic follow zooms are not gestures. Leaflet's gesture handlers
        // supply originalEvent only on some paths, so capture input at the DOM.
        if (e.originalEvent) beginManualExploration();
      });
      var mapElement = document.getElementById('map');
      L.DomEvent.on(mapElement, 'wheel dblclick', beginManualExploration);
      L.DomEvent.on(mapElement, 'touchstart', function(e) {
        if (e.touches && e.touches.length > 1) beginManualExploration();
      });
      L.DomEvent.on(mapElement, 'keydown', function(e) {
        if (['+', '-', '=', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0) beginManualExploration();
      });
      map.on('zoomend moveend', function() { reportCamera('CAMERA_STATE'); });
      reportCamera('MAP_READY');

      updateControlPositions(!!routeData);
    };

    var currentTargetBearing = 0;
    var currentAnimatedBearing = null;
    var isAnimatingBearing = false;
    var bearingFrameId = null;
    var resetFrameId = null;

    function cancelBearingAnimations() {
      if (bearingFrameId !== null) cancelAnimationFrame(bearingFrameId);
      if (resetFrameId !== null) cancelAnimationFrame(resetFrameId);
      bearingFrameId = null;
      resetFrameId = null;
      isAnimatingBearing = false;
    }

    /**
     * Updates the target heading angle.
     */
    window.setTargetHeading = function(rawDeg) {
      if (
        rawDeg === null ||
        rawDeg === undefined ||
        isNaN(rawDeg)
      ) {
        return;
      }

      if (!isHeadingFocused || !map) return;

      currentTargetBearing = -rawDeg;

      if (window.reduceMotionEnabled) {
        cancelBearingAnimations();
        currentAnimatedBearing = currentTargetBearing;
        map.setBearing(currentTargetBearing);
        return;
      }

      if (!isAnimatingBearing) {
        if (currentAnimatedBearing === null) {
          currentAnimatedBearing = map.getBearing
            ? map.getBearing()
            : 0;
        }

        isAnimatingBearing = true;
        bearingFrameId = requestAnimationFrame(animateBearingStep);
      }
    };

    /**
     * Sets heading focus state.
     */
    window.setHeadingFocus = function(focused) {
      cancelBearingAnimations();
      isHeadingFocused = focused;

      var compass = document.querySelector(
        '.compass-control'
      );

      if (compass) {
        compass.style.backgroundColor = focused
          ? '#d3e3fd'
          : 'white';

        compass.setAttribute(
          'aria-pressed',
          focused ? 'true' : 'false'
        );
      }

      if (focused && marker && map) {
        map.setView(marker.getLatLng(), 32, {
          animate: !window.reduceMotionEnabled
        });
      }
    };

    /**
     * Animates map rotation.
     */
    function animateBearingStep() {
      bearingFrameId = null;
      if (!isHeadingFocused || !map) {
        isAnimatingBearing = false;
        return;
      }

      var diff = (
        (currentTargetBearing - currentAnimatedBearing) % 360 + 540
      ) % 360 - 180;

      if (Math.abs(diff) > 0.05) {
        currentAnimatedBearing += diff * 0.03;
        map.setBearing(currentAnimatedBearing);
        bearingFrameId = requestAnimationFrame(animateBearingStep);
      } else {
        currentAnimatedBearing = currentTargetBearing;
        map.setBearing(currentTargetBearing);
        isAnimatingBearing = false;
      }
    }

    /**
     * Smoothly resets rotation.
     */
    function smoothRotateToZero() {
      cancelBearingAnimations();
      if (window.reduceMotionEnabled) {
        currentAnimatedBearing = 0;
        map.setBearing(0);
        return;
      }
      var startBearing = map.getBearing
        ? map.getBearing()
        : 0;

      var diffToZero = (
        (0 - startBearing) % 360 + 540
      ) % 360 - 180;

      var targetBearing = startBearing + diffToZero;
      var startTime = null;
      var duration = 300;

      function step(timestamp) {
        resetFrameId = null;
        if (!startTime) {
          startTime = timestamp;
        }

        var progress = (timestamp - startTime) / duration;

        if (progress > 1) {
          progress = 1;
        }

        var easeProgress =
          1 - Math.pow(1 - progress, 3);

        var stepBearing =
          startBearing +
          (targetBearing - startBearing) * easeProgress;

        map.setBearing(stepBearing);
        currentAnimatedBearing = stepBearing;

        if (progress < 1) {
          resetFrameId = requestAnimationFrame(step);
        } else {
          map.setBearing(targetBearing);
          currentAnimatedBearing = targetBearing;
        }
      }

      resetFrameId = requestAnimationFrame(step);
    }

    /**
     * Updates user position and route geometry.
     */
    // Display-only estimates: never sent to the native routing/speech hook.
    var motionTimer = null;
    var motionEnabled = false;
    var motionTimestamp = null;
    var motionDeadline = 0;
    var motionRouteKey = null;
    function drawMotionPosition(point) {
      if (!map || !marker || !circle || !point) return;
      marker.setLatLng(point);
      circle.setLatLng(point);
      if (isHeadingFocused && !window.manualCameraExploration) {
        map.panTo(point, { animate: false });
      }
    }
    function stopMotion() {
      if (motionTimer !== null) clearInterval(motionTimer);
      motionTimer = null;
      motionEnabled = false;
      motionTimestamp = null;
      if (window.positionInterpolator) window.positionInterpolator.reset();
    }
    window.updateMotionSample = function(fix, geometry, enabled) {
      if (!window.positionInterpolator) return;
      if (!enabled || document.hidden) {
        stopMotion();
        drawMotionPosition([fix.latitude, fix.longitude]);
        return;
      }
      if (fix.timestamp !== motionTimestamp) {
        motionTimestamp = fix.timestamp;
        motionDeadline = Date.now() + 3600;
      }
      var routeKey = JSON.stringify(geometry);
      if (routeKey !== motionRouteKey) {
        window.positionInterpolator.reset();
        motionRouteKey = routeKey;
      }
      motionEnabled = true;
      window.positionInterpolator.update(fix, geometry, Date.now());
      if (motionTimer === null && Date.now() < motionDeadline) {
        // Ten frames/sec gives continuous walking motion without a 60fps loop
        // or repeated React/WebView bridge traffic.
        motionTimer = setInterval(function() {
          if (document.hidden) { stopMotion(); return; }
          drawMotionPosition(window.positionInterpolator.sample(Date.now()));
          if (Date.now() >= motionDeadline) {
            clearInterval(motionTimer); motionTimer = null;
          }
        }, 100);
      }
    };
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) stopMotion();
    });
    window.addEventListener('pagehide', stopMotion);

    window.updateMap = function(
      userLat,
      userLng,
      acc,
      newRoute
    ) {
      if (!map) return;

      var userLatLng = [userLat, userLng];

      if (!motionEnabled) {
        marker.setLatLng(userLatLng);
        circle.setLatLng(userLatLng);
      }
      circle.setRadius(acc);

      if (isHeadingFocused && !motionEnabled) {
        map.setView(
          userLatLng,
          Math.max(map.getZoom(), 32),
          { animate: !window.reduceMotionEnabled }
        );
      }

      if (newRoute) {
        routeData = newRoute;

        var split = splitRouteAtUser(
          userLat,
          userLng,
          newRoute.geometry
        );

        if (traversedPolyline) {
          map.removeLayer(traversedPolyline);
        }

        if (remainingPolyline) {
          map.removeLayer(remainingPolyline);
        }

        traversedPolyline = createTraversedPolyline(
          split.traversed
        );

        remainingPolyline = createRemainingPolyline(
          split.remaining
        );

        // GPS updates must not replace a DOM element in the accessibility tree.
        if (destMarker) {
          var destination = destMarker.getLatLng();
          if (destination.lat !== newRoute.destination.latitude ||
              destination.lng !== newRoute.destination.longitude) {
            destMarker.setLatLng([
              newRoute.destination.latitude,
              newRoute.destination.longitude
            ]);
          }
        } else {
          destMarker = createDestinationMarker(
            newRoute.destination.latitude,
            newRoute.destination.longitude
          );
        }
      } else {
        routeData = null;

        if (traversedPolyline) {
          map.removeLayer(traversedPolyline);
          traversedPolyline = null;
        }

        if (remainingPolyline) {
          map.removeLayer(remainingPolyline);
          remainingPolyline = null;
        }

        if (destMarker) {
          map.removeLayer(destMarker);
          destMarker = null;
        }
      }

      updateControlPositions(!!newRoute);
    };

    /**
     * Recenters the map on the user.
     */
    window.resetView = function() {
      if (map && marker) {
        map.panTo(marker.getLatLng(), {
          animate: !window.reduceMotionEnabled
        });
      }
    };

    /**
     * Adjusts map control positions based on route state.
     */
    var directionsExpanded = false;
    var summaryClearance = 0;

    function updateControlPositions(hasRoute) {
      var rightControlContainer = document.querySelector(
        '.leaflet-top.leaflet-right'
      );

      var leftControlContainer = document.querySelector(
        '.leaflet-top.leaflet-left'
      );

      // Native summary measurements are in the same viewport as this WebView.
      // Keep the existing idle/active anchors, but clear the actual summary.
      var top = hasRoute ? Math.max(150, summaryClearance) : 60;
      var topPosition = top + 'px';
      if (rightControlContainer) rightControlContainer.style.top = topPosition;
      if (leftControlContainer) leftControlContainer.style.top = topPosition;

      var leftBottom = top;
      if (leftControlContainer && leftControlContainer.getBoundingClientRect) {
        leftBottom = Math.max(top, leftControlContainer.getBoundingClientRect().bottom);
      }
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify({
          type: 'MAP_CONTROLS_LAYOUT', hasRoute: !!hasRoute,
          expanded: !!directionsExpanded, clearance: summaryClearance,
          top: top, leftBottom: leftBottom
        }));
      }
    }

    window.updateDirectionsExpanded = function(expanded, hasRoute, clearance) {
      directionsExpanded = !!expanded;
      summaryClearance = Number.isFinite(clearance) ? Math.max(0, clearance) : 0;
      updateControlPositions(hasRoute);
    };
  </script>
</body>
